name: Frontend CI

on:
  # Every branch, not just main/develop. All active development happens on
  # feature branches; restricting the push trigger to two long-lived branches
  # meant a change was first tested at the moment it was already merged.
  push:
    branches: ['**']
  # `branches:` on pull_request filters by BASE branch. Dropping the filter
  # covers PRs into develop and into stacked feature branches too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Two independent pre-build gates. Both are pure text/stdlib assertions
      # with no dependencies, so they run before the Node setup and fail in
      # seconds rather than after a full install-and-build.
      #
      # They arrived from opposite sides of a merge and are complementary, not
      # alternatives — keeping both is the resolution.

      # SEBI execute-only gate. The monorepo ran this from
      # release-hardening-gates.yml, which was not carried into the split; the
      # script sat in the backend repo unreferenced, and unrunnable there since
      # it asserts on a frontend page.
      - name: Execute-only compliance gate
        run: bash scripts/qa/frontend_execute_only_gate.sh

      # Catches assets referenced by this app but absent from ITS OWN public/.
      # The split routed public/v4/illus/*.png to `landing` only while leaving
      # the components here, so /login rendered a broken <Image>.
      - name: Static asset references
        run: python3 scripts/qa/check_public_assets.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://api.quantx.app
          # Inlined by `next build`, not read at runtime. Unset means every
          # /pricing, /proof and /legal/* link resolves against the product
          # origin and 404s — the whole upgrade funnel. lib/marketing-url.ts
          # logs an error when this is empty in a production build.
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}

  # ===========================================================================
  # E2E — REPORTING ONLY, NOT A GATE. DO NOT ADD TO BRANCH PROTECTION YET.
  # ===========================================================================
  # 89 Playwright specs existed in this repo and no CI step invoked a single
  # one of them, so nobody knew what colour they were. This job runs them and
  # publishes the result. `continue-on-error: true` on the job means nothing
  # in here can ever fail the workflow — not the specs, not the build, not
  # the server start.
  #
  # It is wired this way ON PURPOSE. The suite is known-red today (the authed
  # projects need Supabase service credentials, and a slice of specs has been
  # unrunnable since the four-way repo split), and a required check that is
  # red on arrival gets ignored or removed within a week. The counts go to
  # the run summary so the redness is visible without being load-bearing.
  # Drive it to zero, THEN delete the two `continue-on-error` lines and add
  # this job to branch protection. Until then a red E2E step is information,
  # not a merge block.
  e2e:
    name: E2E (Playwright) — reporting only, not a gate
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Production build, not `next dev`. middleware.ts waives its auth check
      # when NODE_ENV === 'development', so a dev server cannot exercise the
      # one auth gate the app has — see tests/e2e/02-auth-redirects.spec.ts.
      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://api.quantx.app
          # Inlined by `next build`, not read at runtime. Unset means every
          # /pricing, /proof and /legal/* link resolves against the product
          # origin and 404s — the whole upgrade funnel. lib/marketing-url.ts
          # logs an error when this is empty in a production build.
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}

      - name: Start production server
        run: |
          npm run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::production server never answered on :3000"
          cat "$RUNNER_TEMP/next-start.log"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://api.quantx.app
          # Inlined by `next build`, not read at runtime. Unset means every
          # /pricing, /proof and /legal/* link resolves against the product
          # origin and 404s — the whole upgrade funnel. lib/marketing-url.ts
          # logs an error when this is empty in a production build.
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}

      # E2E_MODE=prod also tells playwright.config.ts not to spawn its own
      # `npm run dev` webServer. SUPABASE_SERVICE_KEY is what auth.setup.ts
      # needs to seed the E2E user; without it the authed projects fail with
      # an explicit message naming the missing secret.
      - name: Run Playwright specs
        continue-on-error: true
        # Reporters come from playwright.config.ts: `list` for the log and
        # `json` → test-results/results.json for the summary step below.
        run: npx playwright test
        env:
          E2E_MODE: prod
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Counts, and the names of what failed, straight onto the run summary —
      # a non-blocking job nobody reads is the same as no job at all. Parsed
      # from the JSON file in python rather than interpolated into the shell,
      # so nothing from the report can be executed.
      - name: Publish result to run summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib

          print("## E2E (Playwright) — reporting only, not a gate\n")
          src = pathlib.Path("test-results/results.json")
          if not src.exists():
              print("No `test-results/results.json` — the run did not get far "
                    "enough to write a report. See the step log above.")
              raise SystemExit(0)

          report = json.loads(src.read_text())
          buckets = {}
          failed = []

          def walk(suite, trail):
              here = trail + [suite.get("title", "")]
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      status = t.get("status", "unknown")
                      buckets[status] = buckets.get(status, 0) + 1
                      if status in ("unexpected", "flaky"):
                          failed.append(" › ".join(x for x in here + [spec.get("title", "")] if x))
              for child in suite.get("suites", []):
                  walk(child, here)

          for suite in report.get("suites", []):
              walk(suite, [])

          label = {"expected": "passed", "unexpected": "FAILED",
                   "skipped": "skipped", "flaky": "flaky"}
          print("| result | count |")
          print("| --- | --- |")
          for status, count in sorted(buckets.items()):
              print(f"| {label.get(status, status)} | {count} |")

          if failed:
              print(f"\n<details><summary>{len(failed)} failing spec(s)</summary>\n")
              for name in failed:
                  print(f"- `{name}`")
              print("\n</details>")
          else:
              print("\nNothing failing. When this stays true, delete the "
                    "`continue-on-error: true` lines from the `e2e` job and make "
                    "it a required check.")
          PY

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test-results/ holds results.json plus the screenshots, videos and
          # traces the config retains on failure — the whole point of keeping
          # a non-blocking run is being able to look at why it is red.
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
